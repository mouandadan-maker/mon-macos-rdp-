name: macOS_RDP

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Activer le Partage d'Écran et l'utilisateur
      run: |
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -allowAccessFor -allUsers -privs -all
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvncpasswd -vncpasswd MonSuperMdp123!
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent
        sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
        
    - name: Lancer la connexion avec Pinggy Port 5900
      run: |
        # COMMANDE CORRIGÉE AVEC LE PORT 5900 OBLIGATOIRE
        ssh -p 443 -R 0:localhost:5900 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 aZvC1cPjqDJ+tcp@free.pinggy.io
