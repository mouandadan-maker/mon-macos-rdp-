name: macOS_RDP

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Activer le Partage d'Écran macOS Legacy (VNC)
      run: |
        # On définit le mot de passe VNC système correctement pour les connexions distantes
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -clientopts -setvnclegacy -vnclegacy yes -clientopts -setvncpw -vncpw MonSuperMdp123! -restart -agent -privs -all
    
    - name: Lancer la connexion avec Pinggy
      run: |
        # On force la création du tunnel SSH sans vérification de clé
        ssh -o StrictHostKeyChecking=no -p 443 -R 0:localhost:5900 a.pinggy.io
